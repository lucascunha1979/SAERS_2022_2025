name: Montar frontend SAERS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend_parts/GO.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Concatenar e validar
        shell: bash
        run: |
          set -e
          cat frontend_parts/app_part_01.txt frontend_parts/app_part_02.txt frontend_parts/app_part_03.txt frontend_parts/app_part_04.txt frontend_parts/app_part_05.txt frontend_parts/app_part_06.txt > app.js
          node --check app.js
          test -s app.js
          echo "APP_JS_OK"

      - name: Commit
        shell: bash
        run: |
          set -e
          rm -rf frontend_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Conecta mapas, rankings e abas territoriais do SAERS"
          git push
